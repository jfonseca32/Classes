[project]
name = "classes"
version = "0.1.0"
description = "Coursework archive for college classes across engineering, computer science, and design."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "prek>=0.4.11",
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = [
    ".",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
pythonpath = [
    ".",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
