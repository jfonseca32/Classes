#VRML_SIM R2025a utf8
# CS 3630 Project 4: a floor charging pad for the robot fleet, with a small
# charger pillar on the wall side (local -x). The origin is the pad center on
# the floor; the pad is 1.3 m x 1.3 m and 2.8 cm thick (a parked robot stands
# at z = 0.028). The glowing top is the pad's own top face (no coplanar decal),
# so it never z-fights with the floor or the hologram, even from far above.
# `glowColor` (plain exposed field) tints the glowing ring, bolt, and screen.

PROTO ChargingPad [
  field SFVec3f    translation  0.7 24.5 0
  field SFRotation rotation     0 0 1 0
  field SFString   name         "charging pad"
  field SFColor    glowColor    0.25 0.75 1     # Emissive tint of the ring, bolt, and screen.
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    model "charging pad"
    children [
      # Sides of the pad.
      Shape {
        castShadows FALSE
        appearance PBRAppearance {
          baseColor 0.14 0.15 0.17
          roughness 0.6
          metalness 0.4
        }
        geometry IndexedFaceSet {
          coord Coordinate {
            point [
              -0.65 -0.65 0, 0.65 -0.65 0, 0.65 0.65 0, -0.65 0.65 0
              -0.65 -0.65 0.028, 0.65 -0.65 0.028, 0.65 0.65 0.028, -0.65 0.65 0.028
            ]
          }
          coordIndex [ 0 1 5 4 -1 1 2 6 5 -1 2 3 7 6 -1 3 0 4 7 -1 ]
        }
      }
      # Top face: base color and glowing ring/bolt from the generated textures.
      Shape {
        castShadows FALSE
        appearance PBRAppearance {
          baseColorMap ImageTexture {
            url [
              "../textures/charging_pad.jpg"
            ]
          }
          emissiveColorMap ImageTexture {
            url [
              "../textures/charging_pad_glow.jpg"
            ]
          }
          emissiveColor IS glowColor
          emissiveIntensity 2.5
          roughness 0.5
          metalness 0.1
        }
        geometry IndexedFaceSet {
          coord Coordinate {
            point [ -0.65 -0.65 0.028, 0.65 -0.65 0.028, 0.65 0.65 0.028, -0.65 0.65 0.028 ]
          }
          texCoord TextureCoordinate {
            point [ 0 0, 1 0, 1 1, 0 1 ]
          }
          coordIndex [ 0 1 2 3 -1 ]
          texCoordIndex [ 0 1 2 3 -1 ]
        }
      }
      # Charger pillar against the wall, with a status screen facing the pad.
      Pose {
        translation -0.72 0 0.55
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.2 0.22 0.25
              roughness 0.35
              metalness 0.6
            }
            geometry Box {
              size 0.16 0.46 1.1
            }
          }
        ]
      }
      Pose {
        translation -0.72 0 1.13
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.95 0.95 0.95
              roughness 0.3
              metalness 0
            }
            geometry Box {
              size 0.18 0.5 0.06
            }
          }
        ]
      }
      Pose {
        translation -0.637 0 0.82
        children [
          Shape {
            castShadows FALSE
            appearance PBRAppearance {
              baseColor 0 0 0
              roughness 0.1
              metalness 0
              emissiveColor IS glowColor
              emissiveIntensity 1.2
            }
            geometry Box {
              size 0.005 0.3 0.16
            }
          }
        ]
      }
    ]
  }
}
