#VRML_SIM R2025a utf8
# CS 3630 Project 4: the book's warehouse robot (Dellaert & Hutchinson, Section 4.2).
# A circular robot of radius 0.5 m with three omni wheels of radius 0.2 m on its
# rim at theta = 0, 120, and 240 degrees (axles radial), a lift deck, and a slim
# mast carrying a round "eye" whose iris glows and pans toward the direction of
# travel. The robot is kinematic (no Physics node): the supervisor moves it.
#
# Engine hooks. Nodes inside a PROTO body are read-only for a Supervisor, so
# every property the engine animates is exposed as a PROTO field below (write
# it directly, e.g. robot.getField("wheel0Rotation")). The internal DEFs listed
# in DESIGN.md section 6 also exist; for those, use
#   robot.getFromProtoDef("WHEEL_0").getField("rotation").getActualField()
# which returns the same writable PROTO field.
#
#   WHEEL_i (Pose)            rotation     <- wheel<i>Rotation  (axis 1 0 0 = the wheel's axle,
#                                             pointing INTO the robot; angle phi_i = integral of
#                                             omega_i dt, where omega_i = (-sin th_i vx + cos th_i vy)/r
#                                             is the book's wheel speed: positive phi rolls the
#                                             robot along u_par = (-sin th_i, cos th_i))
#   EYE_PAN (Pose)            rotation     <- eyeRotation      (0 0 1 psi; psi = 0 looks along +x)
#   DECK (Pose)               translation  <- deckTranslation  (0 0 0 rest, 0 0 0.04 loaded;
#                                             deck top is at z = 0.64 m at rest)
#   HOLO_POSE (Pose)          translation  <- holoTranslation  (engine sets (49.5-x, 24.5-y, 0.02);
#                                             the default hides the hologram below the floor)
#   BODY_MATERIAL             baseColor    <- bodyColor
#   ACCENT_MATERIAL           baseColor    <- accentColor
#   LED_RING_MATERIAL         emissiveColor <- ledColor
#   EYE_IRIS_MATERIAL         emissiveColor <- irisColor
#   SENSOR_TAG_MATERIAL       emissiveColor <- tagColor
#   HEADLIGHT_0, HEADLIGHT_1  on           <- headlightsOn
#
# Devices (only when withDevices is TRUE): Display "floor_holo" 1000x500 (texture
# of the 100 m x 50 m floor hologram), Display "minimap" 500x250, Speaker
# "speaker", Camera "fpv" 320x180 on the eye (disabled until enabled).
# template language: javascript

PROTO OmniWarehouseRobot [
  field SFVec3f    translation      8 6 0
  field SFRotation rotation         0 0 1 0
  field SFString   name             "amr"
  field SFString   controller       "<none>"
  field MFString   controllerArgs   []
  field SFString   customData       ""
  field SFBool     supervisor       FALSE
  field SFBool     synchronization  TRUE
  field SFColor    bodyColor        0.702 0.639 0.412    # GT gold (#B3A369).
  field SFColor    accentColor      0.0 0.188 0.341      # GT navy (#003057).
  field SFColor    ledColor         0.0 0.85 1.0         # LED ring (state color, emissive).
  field SFColor    irisColor        0.0 0.9 1.0          # Glowing iris of the eye.
  field SFColor    tagColor         0.67 1.0 0.31        # Zone reader (IR receiver) on the antenna: blinks with every reading.
  field SFRotation wheel0Rotation   1 0 0 0              # Spin of wheel 0 about its axle.
  field SFRotation wheel1Rotation   1 0 0 0              # Spin of wheel 1 about its axle.
  field SFRotation wheel2Rotation   1 0 0 0              # Spin of wheel 2 about its axle.
  field SFRotation eyeRotation      0 0 1 0              # Pan of the eye about z.
  field SFVec3f    deckTranslation  0 0 0                # Lift deck offset (0 0 0.04 when loaded).
  field SFVec3f    holoTranslation  0 0 -1               # Hologram plane offset (hidden by default).
  field SFBool     headlightsOn     FALSE                # The two spot lights under the eye.
  field SFBool     withDevices      TRUE                 # FALSE: parked robot without displays, speaker, camera, lights.
]
{
  %<
    // ------------------------------------------------------------------
    // Small IndexedFaceSet builders. Coordinates are printed with 4 decimals.
    // Faces are counterclockwise seen from outside (Webots default ccw TRUE).
    // ------------------------------------------------------------------
    const fmt = (v) => (Math.abs(v) < 5e-5 ? '0' : v.toFixed(4));
    function newMesh() { return { p: [], i: [] }; }
    function vtx(m, v) { m.p.push(fmt(v[0]) + ' ' + fmt(v[1]) + ' ' + fmt(v[2])); return m.p.length - 1; }
    function face(m, ids) { m.i.push(ids.join(' ') + ' -1'); }
    function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
    function mul(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
    function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
    // Surface of revolution of the (radius, height) profile about axis a through c.
    // The profile runs "bottom to top" (along +a) so that normals point outward;
    // b x cb = a must hold. a0/a1 limit the sweep (radians); caps close partial sweeps.
    function lathe(m, profile, c, a, b, n, a0, a1) {
      const cb = cross(a, b);
      const full = (a0 === undefined);
      const start = full ? 0 : a0;
      const span = full ? 2 * Math.PI : a1 - a0;
      const steps = full ? n : Math.max(1, Math.ceil(n * span / (2 * Math.PI)));
      const cols = full ? steps : steps + 1;
      const base = m.p.length;
      for (let s = 0; s < cols; ++s) {
        const ang = start + span * s / steps;
        const dir = add(mul(b, Math.cos(ang)), mul(cb, Math.sin(ang)));
        for (let k = 0; k < profile.length; ++k)
          vtx(m, add(c, add(mul(a, profile[k][1]), mul(dir, profile[k][0]))));
      }
      const np = profile.length;
      for (let s = 0; s < steps; ++s) {
        const s2 = full ? (s + 1) % cols : s + 1;
        for (let k = 0; k < np - 1; ++k)
          face(m, [base + s * np + k, base + s2 * np + k, base + s2 * np + k + 1, base + s * np + k + 1]);
      }
      if (!full && np >= 3) {  // flat end caps (only for closed profiles)
        const first = [], last = [];
        for (let k = 0; k < np; ++k) { first.push(base + k); last.push(base + steps * np + k); }
        face(m, first);
        face(m, last.reverse());
      }
    }
    function emit(m) {
      return 'coord Coordinate { point [ ' + m.p.join(', ') + ' ] } coordIndex [ ' + m.i.join(' ') + ' ]';
    }
    function circleProfile(rc, zc, rad, n) {  // closed small circle in the (r, z) plane (for tori)
      const pts = [];
      for (let k = 0; k <= n; ++k) {
        const t = -Math.PI / 2 + 2 * Math.PI * k / n;
        pts.push([rc + rad * Math.cos(t), zc + rad * Math.sin(t)]);
      }
      return pts;
    }
    const X = [1, 0, 0], Y = [0, 1, 0], Z = [0, 0, 1], O = [0, 0, 0];
    const D2R = Math.PI / 180;

    // ------------------------------------------------------------------
    // One omni wheel in its own frame: axle along +x (pointing into the robot),
    // wheel plane = y-z, radius 0.2 m. Two staggered rows of 10 barrel rollers.
    // ------------------------------------------------------------------
    const WHEEL_R = 0.2;
    const ROLLER_MAX = 0.024, ROLLER_C = WHEEL_R - ROLLER_MAX, ROLLER_L = 0.098, ROWS_X = 0.018, PER_ROW = 10;
    const rollers = newMesh();
    const rollerProfile = [[0.0005, -ROLLER_L / 2]];
    for (let k = 0; k <= 6; ++k) {
      const s = -ROLLER_L / 2 + ROLLER_L * k / 6;
      const q = 2 * s / ROLLER_L;
      rollerProfile.push([ROLLER_MAX * Math.sqrt(1 - 0.62 * q * q), s]);
    }
    rollerProfile.push([0.0005, ROLLER_L / 2]);
    for (let row = 0; row < 2; ++row) {
      const xr = row === 0 ? -ROWS_X : ROWS_X;
      for (let k = 0; k < PER_ROW; ++k) {
        const phi = 2 * Math.PI * (k + 0.5 * row) / PER_ROW;
        const radial = [0, Math.cos(phi), Math.sin(phi)];
        const tangent = [0, -Math.sin(phi), Math.cos(phi)];
        const center = add([xr, 0, 0], mul(radial, ROLLER_C));
        // Frame (b, cb, a) = (x, radial, tangent) is right-handed: x cross radial = tangent.
        lathe(rollers, rollerProfile, center, tangent, X, 8);
      }
    }
    const hub = newMesh();
    // Central hub disk between the two roller rows, and the inner boss toward the motor.
    lathe(hub, [[0.0005, -0.007], [0.150, -0.007], [0.156, -0.003], [0.156, 0.003], [0.150, 0.007], [0.0005, 0.007]], O, X, Y, 40);
    lathe(hub, [[0.0005, 0.0], [0.050, 0.0], [0.050, 0.060], [0.040, 0.066], [0.0005, 0.066]], O, X, Y, 24);
    // Outer cap (the visible outside face of the wheel), slightly domed.
    const cap = newMesh();
    // Axis -x points out of the robot, so heights along it grow toward the outside.
    lathe(cap, [[0.0005, 0.030], [0.108, 0.030], [0.112, 0.036], [0.112, 0.048], [0.106, 0.054], [0.0005, 0.054]], O, [-1, 0, 0], Y, 32);
    // Three bright spokes on the outer cap so the wheel spin is easy to see.
    const spokes = newMesh();
    for (let k = 0; k < 3; ++k) {
      const a = 2 * Math.PI * k / 3;
      const r0 = 0.03, r1 = 0.1, w = 0.013, xs = -0.0548;
      const dir = [0, Math.cos(a), Math.sin(a)], nrm = [0, -Math.sin(a), Math.cos(a)];
      const p0 = add([xs, 0, 0], add(mul(dir, r0), mul(nrm, -w)));
      const p1 = add([xs, 0, 0], add(mul(dir, r1), mul(nrm, -w)));
      const p2 = add([xs, 0, 0], add(mul(dir, r1), mul(nrm, w)));
      const p3 = add([xs, 0, 0], add(mul(dir, r0), mul(nrm, w)));
      const ids = [vtx(spokes, p0), vtx(spokes, p1), vtx(spokes, p2), vtx(spokes, p3)];
      face(spokes, [ids[0], ids[3], ids[2], ids[1]]);  // facing -x (outside of the robot)
    }

    // ------------------------------------------------------------------
    // Body parts in the robot frame (z up, origin on the floor at the center).
    // ------------------------------------------------------------------
    const chassis = newMesh();
    lathe(chassis, [[0.0005, 0.06], [0.36, 0.06], [0.40, 0.075], [0.418, 0.10], [0.425, 0.20], [0.42, 0.34],
                    [0.405, 0.40], [0.0005, 0.40]], O, Z, X, 64);
    const shell = newMesh();
    lathe(shell, [[0.30, 0.395], [0.47, 0.40], [0.508, 0.415], [0.522, 0.44], [0.522, 0.468], [0.512, 0.50],
                  [0.492, 0.53], [0.462, 0.558], [0.425, 0.582], [0.385, 0.60], [0.35, 0.61], [0.32, 0.614],
                  [0.0005, 0.614]], O, Z, X, 72);
    const ledRing = newMesh();
    lathe(ledRing, circleProfile(0.52, 0.454, 0.0085, 10), O, Z, X, 72);
    const bumper = newMesh(), stripe = newMesh(), sensors = newMesh(), pods = newMesh();
    for (let i = 0; i < 3; ++i) {
      const th = 2 * Math.PI * i / 3;
      lathe(bumper, [[0.40, 0.07], [0.49, 0.07], [0.50, 0.08], [0.50, 0.16], [0.49, 0.17], [0.40, 0.17]], O, Z, X, 64,
            th + 32 * D2R, th + 88 * D2R);
      lathe(stripe, [[0.5005, 0.112], [0.5005, 0.126]], O, Z, X, 64, th + 34 * D2R, th + 86 * D2R);
      for (const off of [-14, 0, 14])  // proximity-sensor windows (book Section 4.3.1)
        lathe(sensors, [[0.4262, 0.25], [0.4262, 0.275]], O, Z, X, 120, th + (60 + off - 3) * D2R, th + (60 + off + 3) * D2R);
      // Motor pod joining the chassis to the wheel boss (static, along the radial axle).
      const dir = [Math.cos(th), Math.sin(th), 0];
      lathe(pods, [[0.0005, 0.375], [0.048, 0.375], [0.052, 0.385], [0.052, 0.44], [0.046, 0.448], [0.0005, 0.448]], [0, 0, 0.2], dir,
            [0, 0, 1], 20);
    }
    const deckColumn = newMesh(), deckPlate = newMesh(), mast = newMesh(), mastTube = newMesh();
    lathe(deckColumn, [[0.0005, 0.55], [0.23, 0.55], [0.23, 0.614], [0.0005, 0.614]], O, Z, X, 40);
    lathe(deckPlate, [[0.0005, 0.611], [0.335, 0.611], [0.345, 0.618], [0.345, 0.631], [0.337, 0.6385], [0.0005, 0.6385]], O, Z, X, 64);
    lathe(mast, [[0.0005, 0.57], [0.046, 0.57], [0.046, 0.615], [0.032, 0.628], [0.0005, 0.628]], [-0.40, 0, 0], Z, X, 24);
    lathe(mast, [[0.0005, 0.87], [0.026, 0.87], [0.028, 0.885], [0.026, 0.90], [0.0005, 0.90]], [-0.40, 0, 0], Z, X, 20);
    lathe(mast, [[0.0005, 1.075], [0.024, 1.075], [0.03, 1.09], [0.03, 1.10], [0.0005, 1.10]], [-0.40, 0, 0], Z, X, 20);
    lathe(mastTube, [[0.0005, 0.62], [0.017, 0.62], [0.017, 1.08], [0.0005, 1.08]], [-0.40, 0, 0], Z, X, 16);
    // Deck mat: a textured disk (planar texture coordinates), top at z = 0.640 m.
    const MAT_R = 0.318, MAT_N = 48;
    let matPts = '', matTex = '', matIdx = '';
    for (let k = 0; k < MAT_N; ++k) {
      const a = 2 * Math.PI * k / MAT_N;
      matPts += fmt(MAT_R * Math.cos(a)) + ' ' + fmt(MAT_R * Math.sin(a)) + ' 0.64, ';
      matTex += fmt(0.5 + 0.5 * Math.cos(a)) + ' ' + fmt(0.5 + 0.5 * Math.sin(a)) + ', ';
      matIdx += k + ' ';
    }
    // Eye (EYE_PAN frame: +x is the looking direction).
    const bezel = newMesh(), lens = newMesh(), iris = newMesh(), pupil = newMesh(), glint = newMesh();
    const lampFaces = newMesh(), antenna = newMesh(), brow = newMesh();
    // The lens barrel sticks out of the r = 0.095 eye sphere like a camera lens.
    lathe(bezel, circleProfile(0.0605, 0.0, 0.0105, 10), [0.096, 0, 0], X, Y, 48);
    lathe(lens, [[0.0005, 0.066], [0.058, 0.066], [0.058, 0.098], [0.05, 0.1005], [0.0005, 0.1015]], O, X, Y, 48);
    lathe(iris, [[0.0005, 0.1017], [0.041, 0.1017], [0.041, 0.1021], [0.0005, 0.1027]], O, X, Y, 48);
    lathe(pupil, [[0.0005, 0.1028], [0.0155, 0.1028], [0.0155, 0.1032], [0.0005, 0.1035]], O, X, Y, 24);
    lathe(glint, [[0.0005, 0.1036], [0.0068, 0.1036], [0.0005, 0.1039]], [0, 0.015, 0.016], X, Y, 12);
    // A brow arc over the lens gives the eye some expression.
    lathe(brow, circleProfile(0.082, 0.0, 0.01, 8), [0.07, 0, 0], X, Y, 48, 36 * D2R, 144 * D2R);
    for (const side of [-1, 1])  // two small face lamps under the lens (the headlights)
      lathe(lampFaces, [[0.0005, 0.0], [0.010, 0.0], [0.010, 0.004], [0.0005, 0.005]], [0.071, side * 0.036, -0.058], X, Y, 16);
    lathe(antenna, [[0.0005, 0.08], [0.0035, 0.08], [0.0035, 0.17], [0.0005, 0.17]], [-0.025, 0, 0], Z, X, 8);
    const withDevices = fields.withDevices.value;
  >%
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    model "CS 3630 omni AMR"
    controller IS controller
    controllerArgs IS controllerArgs
    customData IS customData
    supervisor IS supervisor
    synchronization IS synchronization
    children [
      # ---------------------------------------------------------------- contact shadow
      # A soft radial "blob" shadow on the floor: grounds the robot even when the
      # user disabled real-time shadows (Preferences > OpenGL). It floats 3 cm up,
      # above the floor hologram plane (z = 0.02), so that it also shades the hologram.
      Pose {
        translation 0 0 0.03
        children [
          Shape {
            castShadows FALSE
            isPickable FALSE
            appearance PBRAppearance {
              baseColor 0 0 0
              baseColorMap ImageTexture {
                url [
                  "../textures/blob_shadow.png"
                ]
              }
              roughness 1
              metalness 0
            }
            geometry Plane {
              size 2 2
            }
          }
        ]
      }
      # ---------------------------------------------------------------- chassis
      Shape {
        appearance DEF ACCENT_MATERIAL PBRAppearance {
          baseColor IS accentColor
          roughness 0.35
          metalness 0.35
        }
        geometry IndexedFaceSet {
          %<= emit(chassis) >%
          creaseAngle 0.8
        }
      }
      Shape {
        castShadows FALSE
        appearance DEF RUBBER_MATERIAL PBRAppearance {
          baseColor 0.05 0.05 0.055
          roughness 0.8
          metalness 0
        }
        geometry IndexedFaceSet {
          %<= emit(bumper) >%
          creaseAngle 0.6
        }
      }
      Shape {
        appearance PBRAppearance {
          baseColor 0.95 0.72 0.05
          roughness 0.4
          metalness 0
          emissiveColor 0.95 0.65 0.0
          emissiveIntensity 0.15
        }
        geometry IndexedFaceSet {
          %<= emit(stripe) >%
          creaseAngle 1.2
        }
      }
      Shape {
        appearance PBRAppearance {
          baseColor 0.02 0.02 0.025
          roughness 0.05
          metalness 0
          emissiveColor 0.7 0.05 0.08
          emissiveIntensity 0.25
        }
        geometry IndexedFaceSet {
          %<= emit(sensors) >%
          creaseAngle 1.2
        }
      }
      Shape {
        castShadows FALSE
        appearance DEF GRAPHITE_MATERIAL PBRAppearance {
          baseColor 0.11 0.12 0.14
          roughness 0.45
          metalness 0.55
        }
        geometry IndexedFaceSet {
          %<= emit(pods) >%
          creaseAngle 0.8
        }
      }
      # ---------------------------------------------------------------- wheels
      %< for (let i = 0; i < 3; ++i) { const th = 2 * Math.PI * i / 3; >%
      Pose {
        translation %<= fmt(0.5 * Math.cos(th)) >% %<= fmt(0.5 * Math.sin(th)) >% 0.2
        rotation 0 0 1 %<= fmt(th + Math.PI) >%
        children [
          DEF WHEEL_%<= i >% Pose {
            rotation IS wheel%<= i >%Rotation
            children [
              %< if (i === 0) { >%
              DEF OMNI_WHEEL Group {
                children [
                  Shape {
                    castShadows FALSE
                    appearance USE RUBBER_MATERIAL
                    geometry IndexedFaceSet {
                      %<= emit(rollers) >%
                      creaseAngle 1.0
                    }
                  }
                  Shape {
                    castShadows FALSE
                    appearance DEF WHEEL_METAL PBRAppearance {
                      baseColor 0.62 0.64 0.68
                      roughness 0.3
                      metalness 0.85
                    }
                    geometry IndexedFaceSet {
                      %<= emit(hub) >%
                      creaseAngle 0.7
                    }
                  }
                  Shape {
                    castShadows FALSE
                    appearance USE GRAPHITE_MATERIAL
                    geometry IndexedFaceSet {
                      %<= emit(cap) >%
                      creaseAngle 0.7
                    }
                  }
                  Shape {
                    castShadows FALSE
                    appearance DEF WHEEL_SPOKE PBRAppearance {
                      baseColor 0.95 0.75 0.1
                      roughness 0.35
                      metalness 0.1
                      emissiveColor 0.9 0.6 0.0
                      emissiveIntensity 0.2
                    }
                    geometry IndexedFaceSet {
                      %<= emit(spokes) >%
                    }
                  }
                ]
              }
              %< } else { >%
              USE OMNI_WHEEL
              %< } >%
            ]
          }
        ]
      }
      %< } >%
      # ---------------------------------------------------------------- top shell and LED ring
      Shape {
        appearance DEF BODY_MATERIAL PBRAppearance {
          baseColor IS bodyColor
          roughness 0.3
          metalness 0.2
        }
        geometry IndexedFaceSet {
          %<= emit(shell) >%
          creaseAngle 0.9
        }
      }
      Shape {
        castShadows FALSE
        appearance DEF LED_RING_MATERIAL PBRAppearance {
          baseColor 0.05 0.05 0.05
          roughness 0.3
          metalness 0
          emissiveColor IS ledColor
          emissiveIntensity 3
        }
        geometry IndexedFaceSet {
          %<= emit(ledRing) >%
          creaseAngle 1.6
        }
      }
      # ---------------------------------------------------------------- lift deck
      DEF DECK Pose {
        translation IS deckTranslation
        children [
          Shape {
            appearance DEF CHROME_MATERIAL PBRAppearance {
              baseColor 0.8 0.82 0.85
              roughness 0.18
              metalness 0.95
            }
            geometry IndexedFaceSet {
              %<= emit(deckColumn) >%
              creaseAngle 0.8
            }
          }
          Shape {
            appearance USE ACCENT_MATERIAL
            geometry IndexedFaceSet {
              %<= emit(deckPlate) >%
              creaseAngle 0.6
            }
          }
          Shape {
            appearance PBRAppearance {
              baseColorMap ImageTexture {
                url [
                  "../textures/robot_deck.jpg"
                ]
              }
              roughness 0.7
              metalness 0
            }
            geometry IndexedFaceSet {
              coord Coordinate {
                point [ %<= matPts >% ]
              }
              texCoord TextureCoordinate {
                point [ %<= matTex >% ]
              }
              coordIndex [ %<= matIdx >% -1 ]
              texCoordIndex [ %<= matIdx >% -1 ]
            }
          }
        ]
      }
      # ---------------------------------------------------------------- mast and eye
      Shape {
        appearance USE ACCENT_MATERIAL
        geometry IndexedFaceSet {
          %<= emit(mast) >%
          creaseAngle 0.8
        }
      }
      Shape {
        appearance USE CHROME_MATERIAL
        geometry IndexedFaceSet {
          %<= emit(mastTube) >%
          creaseAngle 1.0
        }
      }
      DEF EYE_PAN Pose {
        translation -0.4 0 1.18
        rotation IS eyeRotation
        children [
          Shape {
            appearance USE BODY_MATERIAL
            geometry Sphere {
              radius 0.095
              subdivision 3
            }
          }
          Shape {
            appearance USE ACCENT_MATERIAL
            geometry IndexedFaceSet {
              %<= emit(brow) >%
              creaseAngle 1.6
            }
          }
          Shape {
            appearance USE ACCENT_MATERIAL
            geometry IndexedFaceSet {
              %<= emit(bezel) >%
              creaseAngle 1.6
            }
          }
          Shape {
            appearance PBRAppearance {
              baseColor 0.02 0.025 0.035
              roughness 0.05
              metalness 0.2
            }
            geometry IndexedFaceSet {
              %<= emit(lens) >%
              creaseAngle 0.6
            }
          }
          Shape {
            castShadows FALSE
            appearance DEF EYE_IRIS_MATERIAL PBRAppearance {
              baseColor 0 0 0
              roughness 0.2
              metalness 0
              emissiveColor IS irisColor
              emissiveIntensity 4
            }
            geometry IndexedFaceSet {
              %<= emit(iris) >%
            }
          }
          Shape {
            castShadows FALSE
            appearance PBRAppearance {
              baseColor 0.01 0.01 0.01
              roughness 0.05
              metalness 0
            }
            geometry IndexedFaceSet {
              %<= emit(pupil) >%
            }
          }
          Shape {
            castShadows FALSE
            appearance PBRAppearance {
              baseColor 1 1 1
              roughness 0.1
              metalness 0
              emissiveColor 1 1 1
              emissiveIntensity 3
            }
            geometry IndexedFaceSet {
              %<= emit(glint) >%
            }
          }
          Shape {
            castShadows FALSE
            appearance PBRAppearance {
              baseColor 1 0.95 0.8
              roughness 0.1
              metalness 0
              emissiveColor 1 0.93 0.75
              emissiveIntensity 1.5
            }
            geometry IndexedFaceSet {
              %<= emit(lampFaces) >%
            }
          }
          Shape {
            appearance USE CHROME_MATERIAL
            geometry IndexedFaceSet {
              %<= emit(antenna) >%
              creaseAngle 1.0
            }
          }
          Pose {
            translation -0.025 0 0.182
            children [
              Shape {
                castShadows FALSE
                appearance DEF SENSOR_TAG_MATERIAL PBRAppearance {
                  baseColor 0.05 0.05 0.05
                  roughness 0.2
                  metalness 0
                  emissiveColor IS tagColor
                  emissiveIntensity 5
                }
                geometry Sphere {
                  radius 0.013
                  subdivision 2
                }
              }
            ]
          }
          %< if (withDevices) { >%
          DEF HEADLIGHT_0 SpotLight {
            attenuation 0 0 1
            beamWidth 0.5
            color 1 0.93 0.8
            cutOffAngle 0.75
            direction 1 0 -0.3
            intensity 8
            location 0.95 0.2 -0.62
            on IS headlightsOn
            radius 30
          }
          DEF HEADLIGHT_1 SpotLight {
            attenuation 0 0 1
            beamWidth 0.5
            color 1 0.93 0.8
            cutOffAngle 0.75
            direction 1 0 -0.3
            intensity 8
            location 0.95 -0.2 -0.62
            on IS headlightsOn
            radius 30
          }
          Camera {
            translation 0.105 0 0
            name "fpv"
            fieldOfView 1.2
            width 320
            height 180
            near 0.05
          }
          %< } >%
        ]
      }
      %< if (withDevices) { >%
      # ---------------------------------------------------------------- devices
      Display {
        name "floor_holo"
        width 1000
        height 500
        children [
          DEF HOLO_POSE Pose {
            translation IS holoTranslation
            children [
              Shape {
                castShadows FALSE
                isPickable FALSE
                appearance Appearance {
                  material Material {
                    diffuseColor 0 0 0
                    emissiveColor 1 1 1
                  }
                  # Trilinear + anisotropic filtering: the 10 px/m hologram reads as smooth light
                  # instead of 10 cm blocks in close views (Webots R2025a regenerates the mipmaps
                  # of a Display texture on every image update; verified from near and far views).
                  texture ImageTexture {
                    filtering 4
                  }
                }
                geometry Plane {
                  size 100 50
                }
              }
            ]
          }
        ]
      }
      Display {
        name "minimap"
        width 500
        height 250
      }
      Speaker {
        translation 0 0 0.3
        name "speaker"
      }
      %< } >%
    ]
  }
}
