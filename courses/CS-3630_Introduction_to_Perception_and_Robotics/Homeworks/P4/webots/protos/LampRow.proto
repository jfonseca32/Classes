#VRML_SIM R2025a utf8
# CS 3630 Project 4: a row of linear high-bay LED fixtures hanging from a
# rail. The origin is the center of the row at the height of the diffusers;
# the fixtures are spaced along local y. The lamps are emissive only (no Light
# node): `intensity` (a plain exposed field, cheap to animate) sets the
# emissive intensity of all diffusers, 0 = off. The engine's boot "power-up"
# turns the rows of DEF CEILING_LAMPS on one by one.
# template language: javascript

PROTO LampRow [
  field SFVec3f    translation   0 24.5 8.4
  field SFRotation rotation      0 0 1 0
  field SFString   name          "lamp row"
  field SFInt32    count         10              # Number of fixtures.
  field SFFloat    spacing       4.6             # Distance between fixtures (m).
  field SFFloat    hangerLength  1.1             # From the fixture top to the rail.
  field SFFloat    intensity     6               # Emissive intensity of the diffusers (0 = off).
  field SFColor    color         1 0.96 0.88     # Emissive color of the diffusers.
]
{
  %<
    const f = (v) => (Math.abs(v) < 5e-5 ? '0' : v.toFixed(3));
    const FACES = [[0, 3, 2, 1], [4, 5, 6, 7], [0, 1, 5, 4], [2, 3, 7, 6], [3, 0, 4, 7], [1, 2, 6, 5]];
    function newMesh() { return { p: [], i: [] }; }
    function box(m, x0, x1, y0, y1, z0, z1) {
      const b = m.p.length;
      for (const c of [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]])
        m.p.push(f(c[0]) + ' ' + f(c[1]) + ' ' + f(c[2]));
      for (const q of FACES)
        m.i.push((b + q[0]) + ' ' + (b + q[1]) + ' ' + (b + q[2]) + ' ' + (b + q[3]) + ' -1');
    }
    const emit = (m) => 'coord Coordinate { point [ ' + m.p.join(', ') + ' ] } coordIndex [ ' + m.i.join(' ') + ' ]';
    const n = Math.max(1, fields.count.value), d = fields.spacing.value, hang = fields.hangerLength.value;
    const housings = newMesh(), diffusers = newMesh(), steel = newMesh();
    const railZ = 0.1 + hang;
    const len = (n - 1) * d + 1.6;
    box(steel, -0.05, 0.05, -len / 2, len / 2, railZ, railZ + 0.07);
    for (let k = 0; k < n; ++k) {
      const y = (k - (n - 1) / 2) * d;
      box(housings, -0.17, 0.17, y - 0.72, y + 0.72, 0.006, 0.1);
      box(housings, -0.19, 0.19, y - 0.74, y - 0.7, 0.0, 0.11);
      box(housings, -0.19, 0.19, y + 0.7, y + 0.74, 0.0, 0.11);
      box(diffusers, -0.14, 0.14, y - 0.68, y + 0.68, -0.004, 0.006);
      for (const s of [-0.5, 0.5])
        box(steel, -0.007, 0.007, y + s - 0.007, y + s + 0.007, 0.1, railZ);
    }
  >%
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    model "LED high-bay lamp row"
    children [
      Shape {
        castShadows FALSE
        appearance PBRAppearance {
          baseColor 0.82 0.83 0.85
          roughness 0.35
          metalness 0.7
        }
        geometry IndexedFaceSet {
          %<= emit(housings) >%
        }
      }
      Shape {
        castShadows FALSE
        appearance PBRAppearance {
          baseColor 0.9 0.9 0.88
          roughness 0.3
          metalness 0
          emissiveColor IS color
          emissiveIntensity IS intensity
        }
        geometry IndexedFaceSet {
          %<= emit(diffusers) >%
        }
      }
      Shape {
        castShadows FALSE
        appearance PBRAppearance {
          baseColor 0.25 0.26 0.28
          roughness 0.4
          metalness 0.8
        }
        geometry IndexedFaceSet {
          %<= emit(steel) >%
        }
      }
    ]
  }
}
