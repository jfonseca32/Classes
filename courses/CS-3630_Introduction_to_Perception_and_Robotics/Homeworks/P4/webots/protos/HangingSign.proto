#VRML_SIM R2025a utf8
# CS 3630 Project 4: a sign board (hanging from cables or mounted on a wall).
# `sign` selects the artwork from the textures generated by
# tools/generate_assets.py: "A".."D" (rack blocks), "AISLE 1".."AISLE 3",
# "ROBOTS AT WORK", "DOCK 1".."DOCK 3", "RECEIVING", "CHARGING", "SHIPPING",
# "SAFETY FIRST", and "FACILITY".
# The origin is the center of the board; the board lies in the local x-z plane
# with its front facing local -y. With `doubleSided` the back shows the same
# artwork (not mirrored). The board is slightly self-lit so it reads at dusk.
# template language: javascript

PROTO HangingSign [
  field SFVec3f    translation  0 0 7
  field SFRotation rotation     0 0 1 0
  field SFString   name         "sign"
  field SFString   sign         "A"          # Artwork, see the list above.
  field SFFloat    width        2.4          # Board width in meters (height follows the artwork).
  field SFFloat    cableLength  0            # > 0: hang from two cables of this length.
  field SFBool     doubleSided  TRUE
  field SFFloat    glow         0.45         # Self-illumination of the artwork.
]
{
  %<
    // sign -> [texture, v0, v1, width / height]; atlas rows are stacked from the top (v = 1).
    const catalog = {
      'A': ['rack_sign_A.png', 0, 1, 1.0], 'B': ['rack_sign_B.png', 0, 1, 1.0],
      'C': ['rack_sign_C.png', 0, 1, 1.0], 'D': ['rack_sign_D.png', 0, 1, 1.0],
      'AISLE 1': ['aisle_signs.png', 3 / 4, 1, 4.0], 'AISLE 2': ['aisle_signs.png', 2 / 4, 3 / 4, 4.0],
      'AISLE 3': ['aisle_signs.png', 1 / 4, 2 / 4, 4.0], 'ROBOTS AT WORK': ['aisle_signs.png', 0, 1 / 4, 4.0],
      'DOCK 1': ['dock_sign_1.png', 0, 1, 2.0], 'DOCK 2': ['dock_sign_2.png', 0, 1, 2.0],
      'DOCK 3': ['dock_sign_3.png', 0, 1, 2.0],
      'RECEIVING': ['zone_banners.png', 3 / 4, 1, 8.0], 'CHARGING': ['zone_banners.png', 2 / 4, 3 / 4, 8.0],
      'SHIPPING': ['zone_banners.png', 1 / 4, 2 / 4, 8.0], 'SAFETY FIRST': ['zone_banners.png', 0, 1 / 4, 8.0],
      'FACILITY': ['facility_sign.png', 0, 1, 8.0],
    };
    let entry = catalog[fields.sign.value.toUpperCase()];
    if (entry === undefined) {
      console.error('HangingSign: unknown sign "' + fields.sign.value + '".');
      entry = catalog['A'];
    }
    const f = (v) => (Math.abs(v) < 5e-5 ? '0' : v.toFixed(4));
    const w = fields.width.value, h = w / entry[3];
    const v0 = entry[1] + 0.002, v1 = entry[2] - 0.002;
    const hx = w / 2, hz = h / 2, t = 0.03;
    const cable = fields.cableLength.value;
  >%
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    model "sign"
    children [
      Shape {
        appearance PBRAppearance {
          baseColor 0.12 0.13 0.15
          roughness 0.4
          metalness 0.6
        }
        geometry Box {
          size %<= f(w + 0.08) >% %<= f(2 * t) >% %<= f(h + 0.08) >%
        }
      }
      Shape {
        castShadows FALSE
        appearance PBRAppearance {
          baseColorMap DEF SIGN_ART ImageTexture {
            url [
              "../textures/%<= entry[0] >%"
            ]
          }
          emissiveColorMap USE SIGN_ART
          emissiveIntensity IS glow
          roughness 0.45
          metalness 0
        }
        geometry IndexedFaceSet {
          coord Coordinate {
            point [
              %<= f(-hx) >% %<= f(-t - 0.002) >% %<= f(-hz) >%, %<= f(hx) >% %<= f(-t - 0.002) >% %<= f(-hz) >%,
              %<= f(hx) >% %<= f(-t - 0.002) >% %<= f(hz) >%, %<= f(-hx) >% %<= f(-t - 0.002) >% %<= f(hz) >%,
              %<= f(hx) >% %<= f(t + 0.002) >% %<= f(-hz) >%, %<= f(-hx) >% %<= f(t + 0.002) >% %<= f(-hz) >%,
              %<= f(-hx) >% %<= f(t + 0.002) >% %<= f(hz) >%, %<= f(hx) >% %<= f(t + 0.002) >% %<= f(hz) >%
            ]
          }
          texCoord TextureCoordinate {
            point [ 0 %<= f(v0) >%, 1 %<= f(v0) >%, 1 %<= f(v1) >%, 0 %<= f(v1) >% ]
          }
          coordIndex [ 0 1 2 3 -1 %< if (fields.doubleSided.value) { >% 4 5 6 7 -1 %< } >% ]
          texCoordIndex [ 0 1 2 3 -1 %< if (fields.doubleSided.value) { >% 0 1 2 3 -1 %< } >% ]
        }
      }
      %< if (cable > 0) { >%
      Shape {
        castShadows FALSE
        appearance PBRAppearance {
          baseColor 0.3 0.3 0.32
          roughness 0.4
          metalness 0.8
        }
        geometry IndexedFaceSet {
          %<
            let pts = '', idx = '';
            let n = 0;
            for (const x of [-hx * 0.8, hx * 0.8]) {
              const z0 = hz + 0.04, z1 = hz + 0.04 + cable, r = 0.008;
              for (const z of [z0, z1])
                for (const c of [[-r, -r], [r, -r], [r, r], [-r, r]])
                  pts += f(x + c[0]) + ' ' + f(c[1]) + ' ' + f(z) + ', ';
              for (let k = 0; k < 4; ++k) {
                const k2 = (k + 1) % 4;
                idx += (n + k) + ' ' + (n + k2) + ' ' + (n + 4 + k2) + ' ' + (n + 4 + k) + ' -1 ';
              }
              n += 8;
            }
          >%
          coord Coordinate {
            point [ %<= pts >% ]
          }
          coordIndex [ %<= idx >% ]
        }
      }
      %< } >%
    ]
  }
}
