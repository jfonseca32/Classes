#VRML_SIM R2025a utf8
# CS 3630 Project 4: the warehouse floor and the truck yard around it.
# The interior floor is one 100 m x 50 m plane centered at world (49.5, 24.5)
# carrying the baked texture textures/floor.jpg (40.96 px/m; generated by
# tools/generate_assets.py): the floor spans x in [-0.5, 99.5] and
# y in [-0.5, 49.5], the same frame as gtbook.logistics. Outside, the asphalt
# yard lies 1.2 m lower (the height of a truck bed), with a concrete dock
# apron and trailer guide lines in front of the east docks.

EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/appearances/protos/Asphalt.proto"

PROTO WarehouseFloor [
  field SFVec3f    translation  49.5 24.5 0
  field SFRotation rotation     0 0 1 0
  field SFString   name         "warehouse floor"
  field SFFloat    roughness    0.55          # Polished concrete (lower = shinier).
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    model "warehouse floor"
    children [
      Shape {
        castShadows FALSE
        appearance PBRAppearance {
          baseColorMap ImageTexture {
            url [
              "../textures/floor.jpg"
            ]
            filtering 5
          }
          roughness IS roughness
          metalness 0
        }
        geometry Plane {
          size 100 50
        }
      }
      # Asphalt yard, 1.2 m below the warehouse floor.
      Pose {
        translation 10 0 -1.2
        children [
          Shape {
            castShadows FALSE
            isPickable FALSE
            appearance Asphalt {
              colorOverride 0.72 0.72 0.74
              textureTransform TextureTransform {
                scale 70 45
              }
            }
            geometry Plane {
              size 280 180
            }
          }
        ]
      }
      # Concrete dock apron in front of the east wall, with trailer guide lines.
      Pose {
        translation 64.5 0 -1.195
        children [
          Shape {
            castShadows FALSE
            isPickable FALSE
            appearance PBRAppearance {
              baseColor 0.55 0.56 0.58
              roughness 0.75
              metalness 0
            }
            geometry Plane {
              size 29 54
            }
          }
        ]
      }
      Pose {
        translation 60 0 -1.19
        children [
          Shape {
            castShadows FALSE
            isPickable FALSE
            appearance DEF GUIDE_PAINT PBRAppearance {
              baseColor 0.97 0.74 0.05
              roughness 0.6
              metalness 0
            }
            geometry IndexedFaceSet {
              coord Coordinate {
                point [
                  -9 -16.575 0, 9 -16.575 0, 9 -16.425 0, -9 -16.425 0,
                  -9 -12.575 0, 9 -12.575 0, 9 -12.425 0, -9 -12.425 0,
                  -9 -1.575 0, 9 -1.575 0, 9 -1.425 0, -9 -1.425 0,
                  -9 2.425 0, 9 2.425 0, 9 2.575 0, -9 2.575 0,
                  -9 13.425 0, 9 13.425 0, 9 13.575 0, -9 13.575 0,
                  -9 17.425 0, 9 17.425 0, 9 17.575 0, -9 17.575 0
                ]
              }
              coordIndex [ 0 1 2 3 -1 4 5 6 7 -1 8 9 10 11 -1 12 13 14 15 -1 16 17 18 19 -1 20 21 22 23 -1 ]
            }
          }
        ]
      }
    ]
    boundingObject Plane {
      size 100 50
    }
  }
}
