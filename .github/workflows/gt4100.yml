name: GT4100

on:
  pull_request:
    paths:
      - "courses/GT-4100_Fundamentals_of_Personal_Finance/**"
      - ".github/workflows/gt4100.yml"
  push:
    branches:
      - main
    paths:
      - "courses/GT-4100_Fundamentals_of_Personal_Finance/**"
      - ".github/workflows/gt4100.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate coursework files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Validate Office documents
        shell: bash
        run: |
          while IFS= read -r -d '' document; do
            unzip -t "$document" >/dev/null
            echo "Validated $document"
          done < <(find courses/GT-4100_Fundamentals_of_Personal_Finance \
            \( -name '*.xlsx' -o -name '*.docx' \) -print0)
