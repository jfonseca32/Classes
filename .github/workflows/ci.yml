name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: make install

      - name: Run lint
        run: make lint

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install C++ compiler
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test
